name: tests BiDi

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Playwright SHA / ref to test. Use 'refs/pull/PULL_REQUEST_ID/head' to test a PR. Defaults to the current branch.
        required: false
        default: ''
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tests_bidi.yml
      - packages/playwright-core/src/server/bidi/**
      - tests/bidi/**
  schedule:
    # Run every day at midnight
    - cron: '0 0 * * *'

env:
  FORCE_COLOR: 1

jobs:
  test_bidi:
    name: BiDi
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # This is required for actions/checkout and to push to the bidi-reports branch
    strategy:
      fail-fast: false
      matrix:
        channel: [bidi-chromium, moz-firefox-nightly]
        isPullRequest:
        - ${{ github.event_name == 'pull_request' }}
        exclude:
        - isPullRequest: true
          channel: bidi-chromium
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: github.event_name != 'workflow_dispatch'
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: github.event_name == 'workflow_dispatch'
      with:
        ref: ${{ github.event.inputs.ref }}
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 20
    - run: npm ci
    - run: npm run build
    # Needed for video tests
    - run: npx playwright install ffmpeg
    - run: npx playwright install --with-deps chromium
    - if: matrix.channel == 'moz-firefox-nightly'
      run: |
        sudo apt-get update
        sudo apt-get install -y libavcodec60
        echo "BIDI_FFPATH=$(npx -y @puppeteer/browsers install firefox@nightly | tail -n1 | sed 's/^[^ ]* *//')" >> "$GITHUB_ENV"
    - name: Run tests
      run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" -- npm run biditest -- --retries=${{ matrix.isPullRequest && 2 || 0 }} --project=${{ matrix.channel }}*
      env:
        PWTEST_USE_BIDI_EXPECTATIONS: ${{ matrix.isPullRequest && '1' || '' }}
    - name: Upload csv report to GitHub
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: csv-report-${{ matrix.channel }}
        path: test-results/report.csv
        retention-days: 7

    - name: Upload parquet report
      if: ${{ !cancelled() }}
      uses: ./.github/actions/upload-parquet-report
      with:
        job_name: ${{ matrix.channel }}

    - name: Add report to the job summary
      if: ${{ !cancelled() && hashFiles('test-results/report.md') != '' }}
      run: cat test-results/report.md >> "$GITHUB_STEP_SUMMARY"

    - name: Publish report.csv to the bidi-reports branch
      if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.repository == 'microsoft/playwright' }}
      run: |
        cp test-results/report.csv "$RUNNER_TEMP/report.csv"
        REPO_URL="https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git"
        # Seed the orphan branch on the first run, or if it ever gets deleted.
        if ! git ls-remote --exit-code --heads "$REPO_URL" bidi-reports > /dev/null; then
          git init -q "$RUNNER_TEMP/seed"
          cd "$RUNNER_TEMP/seed"
          echo 'Nightly BiDi test reports, published by .github/workflows/tests_bidi.yml.' > README.md
          git add README.md
          git commit -q -m 'chore: seed the bidi-reports branch'
          git push "$REPO_URL" HEAD:refs/heads/bidi-reports || true
        fi
        git clone --depth=1 --branch bidi-reports "$REPO_URL" "$RUNNER_TEMP/bidi-reports"
        cd "$RUNNER_TEMP/bidi-reports"
        # Both matrix channels push to the same branch, so retry on a racing push.
        for i in 1 2 3 4 5; do
          git fetch --depth=1 origin bidi-reports
          git reset --hard FETCH_HEAD
          cp "$RUNNER_TEMP/report.csv" '${{ matrix.channel }}.csv'
          git add '${{ matrix.channel }}.csv'
          if git diff --cached --quiet; then
            echo "No changes since the last run."
            exit 0
          fi
          git commit -m "bidi(${{ matrix.channel }}): results for ${GITHUB_SHA:0:9}"
          if git push origin HEAD:bidi-reports; then
            echo "Report url: https://github.com/$GITHUB_REPOSITORY/blob/bidi-reports/${{ matrix.channel }}.csv"
            echo "Raw report url: https://raw.githubusercontent.com/$GITHUB_REPOSITORY/bidi-reports/${{ matrix.channel }}.csv"
            exit 0
          fi
          sleep $((RANDOM % 10 + 5))
        done
        echo "Failed to push the report after 5 attempts."
        exit 1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GIT_AUTHOR_NAME: microsoft-playwright-automation[bot]
        GIT_AUTHOR_EMAIL: 203992400+microsoft-playwright-automation[bot]@users.noreply.github.com
        GIT_COMMITTER_NAME: microsoft-playwright-automation[bot]
        GIT_COMMITTER_EMAIL: 203992400+microsoft-playwright-automation[bot]@users.noreply.github.com
