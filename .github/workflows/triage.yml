# Copilot triages and fixes the issue without write credentials. Fresh jobs open
# the completed fix as a draft PR using the app, so CI runs on it, and comment on the issue.
name: Issue triage

on:
  # Apply needs-triage-linux, needs-triage-mac or needs-triage-win; re-apply it to trigger another pass.
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to triage"
        type: string
        required: true
      platform:
        description: "Platform to triage on"
        type: choice
        required: true
        default: linux
        options:
        - linux
        - mac
        - windows
      task:
        description: "Optional task to direct the triage, such as what to focus on"
        type: string
        required: false
        default: ""

permissions: {}

jobs:
  triage:
    name: Triage issue ${{ github.event.issue.number || inputs.issue }} (${{ inputs.platform || github.event.label.name }})
    if: >-
      github.repository == 'microsoft/playwright' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(fromJSON('["needs-triage-linux","needs-triage-mac","needs-triage-win"]'), github.event.label.name))
    # Falls back to a runner name for unrelated labels, where the job is skipped anyway.
    runs-on: ${{ fromJSON('{"linux":"playwright-x64-ubuntu24-64-core","mac":"macos-15-xlarge","windows":"playwright-x64-server2025-64-core"}')[inputs.platform || fromJSON('{"needs-triage-linux":"linux","needs-triage-mac":"mac","needs-triage-win":"windows"}')[github.event.label.name]] || 'ubuntu-latest' }}
    timeout-minutes: 240
    concurrency:
      group: triage-${{ github.event.issue.number || inputs.issue }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
      TRIAGE_PLATFORM: ${{ inputs.platform || fromJSON('{"needs-triage-linux":"linux","needs-triage-mac":"mac","needs-triage-win":"windows"}')[github.event.label.name] }}
    permissions:
      copilot-requests: write
    outputs:
      base: ${{ steps.base.outputs.sha }}
      setup: ${{ steps.setup.outcome }}
      agent: ${{ steps.agent.outcome }}
      has_fix: ${{ steps.save.outputs.has_fix }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: main
        persist-credentials: false
    - name: Record the base and output directory
      id: base
      run: |
        [[ "$ISSUE" =~ ^[1-9][0-9]*$ ]] || { echo "issue must be a positive integer" >&2; exit 1; }
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "OUTPUT_DIR=${RUNNER_TEMP//\\//}/triage" >> "$GITHUB_ENV"
        echo "SCRATCH_DIR=${RUNNER_TEMP//\\//}/scratch" >> "$GITHUB_ENV"
        echo "PLAYWRIGHT_DIR=${GITHUB_WORKSPACE//\\//}" >> "$GITHUB_ENV"
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
    - name: Install Playwright dependencies and browsers
      id: setup
      run: |
        mkdir -p "$OUTPUT_DIR" "$SCRATCH_DIR"
        npm ci
        npm install -g @github/copilot
        npm run build
        npx playwright install --with-deps chromium firefox webkit
    - name: Triage with Copilot CLI
      id: agent
      # A finished proposal is still useful if the session exhausts its budget.
      continue-on-error: true
      env:
        COPILOT_GITHUB_TOKEN: ${{ github.token }}
        TASK: ${{ inputs.task }}
      run: |
        PROMPT="Follow .claude/skills/playwright-triage/SKILL.md. Read it and the triage.md it
        points to in full before starting.

        Issue: https://github.com/microsoft/playwright/issues/$ISSUE"
        if [[ -n "$TASK" ]]; then
          PROMPT="$PROMPT

        Task: $TASK"
        fi
        copilot \
          --allow-all-tools \
          --allow-all-paths \
          --no-ask-user \
          --enable-all-github-mcp-tools \
          --share="$OUTPUT_DIR/copilot-session.md" \
          --model gpt-6.1-sol \
          --max-ai-credits 5000 \
          -p "$PROMPT"
    - name: Save the outcome
      id: save
      if: always()
      env:
        AGENT_OUTCOME: ${{ steps.agent.outcome }}
      run: |
        mkdir -p "$OUTPUT_DIR"
        if [[ -f "$OUTPUT_DIR/fix/proposal.json" ]]; then
          echo "has_fix=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_fix=false" >> "$GITHUB_OUTPUT"
        fi
        echo "Copilot step: $AGENT_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
        if [[ -f "$OUTPUT_DIR/summary.md" ]]; then
          cat "$OUTPUT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "No investigation summary was produced; see the session artifact." >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Upload investigation and fix
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: triage
        path: ${{ env.OUTPUT_DIR }}
        if-no-files-found: warn

  publish:
    name: Open draft pull request
    needs: triage
    # proposal.json is written last, so a finished proposal is published even when the job failed later.
    if: ${{ !cancelled() && needs.triage.outputs.has_fix == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.publish.outputs.pr }}
    steps:
    - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      id: app-token
      with:
        client-id: ${{ vars.PLAYWRIGHT_APP_CLIENT_ID }}
        private-key: ${{ secrets.PLAYWRIGHT_PRIVATE_KEY }}
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.triage.outputs.base }}
        token: ${{ steps.app-token.outputs.token }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: triage
        path: ${{ runner.temp }}/triage
    # Never execute code or scripts from the proposed changes in the app job.
    - name: Validate, push and open draft
      id: publish
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        BASE_SHA: ${{ needs.triage.outputs.base }}
        ISSUE: ${{ github.event.issue.number || inputs.issue }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      with:
        github-token: ${{ steps.app-token.outputs.token }}
        script: |
          const fs = require('fs');
          const path = require('path');
          const { execFileSync } = require('child_process');
          const { ISSUE, RUNNER_TEMP, RUN_URL } = process.env;
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const dir = path.join(RUNNER_TEMP, 'triage', 'fix');
          const { owner, repo } = context.repo;
          git('apply', '--index', path.join(dir, 'fix.patch'));

          // Workflow changes would run with this repo's secrets in PR CI.
          const workflowFiles = git('diff', '--cached', '--name-only', '--no-renames', '-z').split('\0').filter(file => file.startsWith('.github/'));
          if (workflowFiles.length)
            throw new Error(`Patch changes workflow files, treating it as compromised: ${workflowFiles.join(', ')}`);

          const { title } = JSON.parse(fs.readFileSync(path.join(dir, 'proposal.json'), 'utf8'));
          const description = fs.readFileSync(path.join(dir, 'pr-body.md'), 'utf8').trim();
          const branch = `triage/${ISSUE}/${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`;
          git('config', 'user.name', 'microsoft-playwright-automation[bot]');
          git('config', 'user.email', '203992400+microsoft-playwright-automation[bot]@users.noreply.github.com');
          git('switch', '-c', branch);
          git('commit', '-m', title, '-m', `Fixes: https://github.com/${owner}/${repo}/issues/${ISSUE}`);
          git('push', 'origin', `HEAD:refs/heads/${branch}`);
          const { data: pr } = await github.rest.pulls.create({
            owner, repo, head: branch, base: 'main', title,
            body: `${description}\n\n<sub>Prepared by the [triage workflow](${RUN_URL}).</sub>`,
            draft: true,
          });
          core.setOutput('pr', pr.html_url);

  comment:
    name: Comment on the issue
    needs: [triage, publish]
    # Runs after every triage run, including failed ones, and whatever publish did.
    if: ${{ !cancelled() && needs.triage.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
      PLATFORM_NAME: ${{ fromJSON('{"linux":"Linux","mac":"macOS","windows":"Windows","needs-triage-linux":"Linux","needs-triage-mac":"macOS","needs-triage-win":"Windows"}')[inputs.platform || github.event.label.name] }}
      TRIAGE_RESULT: ${{ needs.triage.result }}
      SETUP_OUTCOME: ${{ needs.triage.outputs.setup }}
      AGENT_OUTCOME: ${{ needs.triage.outputs.agent }}
      PUBLISH_RESULT: ${{ needs.publish.result }}
      PR_URL: ${{ needs.publish.outputs.pr }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      # A failed triage run may not have uploaded anything.
      continue-on-error: true
      with:
        name: triage
        path: output
    - name: Post triage comment
      run: |
        mkdir -p output
        if [[ ! -s output/comment.md ]]; then
          if [[ "$SETUP_OUTCOME" == "failure" ]]; then
            reason="installing dependencies, building or downloading browsers failed"
          elif [[ "$AGENT_OUTCOME" == "failure" ]]; then
            reason="the Copilot session failed or ran out of budget before it wrote a result"
          elif [[ "$TRIAGE_RESULT" != "success" ]]; then
            reason="the triage job ended with result \`$TRIAGE_RESULT\`, for example after a timeout"
          else
            reason="the Copilot session ended without writing a result"
          fi
          echo "Hi, I'm the Playwright bot. I couldn't finish triaging this issue: $reason. The agent run has the details." > output/comment.md
        fi
        if [[ -n "$PR_URL" ]]; then
          printf '\n\nDraft fix: %s\n' "$PR_URL" >> output/comment.md
        elif [[ "$PUBLISH_RESULT" == "failure" ]]; then
          printf '\n\nThe bot proposed a fix, but opening the pull request failed. The agent run has the details.\n' >> output/comment.md
        fi
        printf '\n\n<sub>Triaged on %s by the Playwright bot - [agent run](%s)</sub>\n<!-- playwright-ai-triage -->\n' "$PLATFORM_NAME" "$WORKFLOW_URL" >> output/comment.md
        gh issue comment "$ISSUE" --body-file output/comment.md
