name: extension

on:
  push:
    branches:
      - main
      - release-*
    paths:
      - 'packages/playwright-core/src/tools/**'
      - '!packages/playwright-core/src/tools/dashboard/**'
      - '!packages/playwright-core/src/tools/trace/**'
      - 'packages/extension/**'
      - 'tests/extension/**'
      - '.github/workflows/tests_extension.yml'
  pull_request:
    branches:
      - main
      - release-*
    paths:
      - 'packages/playwright-core/src/tools/**'
      - '!packages/playwright-core/src/tools/dashboard/**'
      - '!packages/playwright-core/src/tools/trace/**'
      - 'packages/extension/**'
      - 'tests/extension/**'
      - '.github/workflows/tests_extension.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1
  DEBUG: pw:mcp:error

jobs:
  test_extension:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
    - run: npm ci
    - run: npm run build
    - run: npx playwright install --with-deps chromium
    - run: npm run test-extension
    - name: Upload parquet report
      if: ${{ !cancelled() }}
      uses: ./.github/actions/upload-parquet-report
      with:
        job_name: extension-${{ matrix.os }}
