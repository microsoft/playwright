# Reusable CI triage for PR test failures. Callable from other repos
# (e.g. microsoft/playwright-browsers) via workflow_call.
name: PR CI Triage

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'PR number to triage'
        required: true
        type: string

permissions: {}

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: read
      copilot-requests: write
    outputs:
      has_draft: ${{ steps.triage.outputs.has-result }}
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      TARGET_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/playwright
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Triage failures with Copilot CLI
        id: triage
        uses: ./.github/actions/run-agent
        with:
          prompt: |
            Come up with a verdict on the CI test failures on pull request #${{ inputs.pr_number }} of ${{ github.repository }}: are they likely caused by this PR? Follow the pr-ci-triage guide (.github/workflows/pr-ci-triage.md) for the analysis.

            Write your verdict to ${{ runner.temp }}/ci-triage/triage.md as a PR comment, in the format the guide specifies and the bot voice register (bot-voice.md in the shared guides).

            Do not post anything yourself. A later workflow step posts triage.md.
          output-dir: ${{ runner.temp }}/ci-triage
          result-file: triage.md
          artifact-name: ci-triage-${{ inputs.pr_number }}
          github-tools: true
          max-ai-credits: 500

      - name: Add session transcript to job summary
        if: ${{ always() }}
        run: |
          {
            echo "## CI triage session transcript (PR #$PR_NUMBER on $TARGET_REPO)"
            echo ''
            cat "$RUNNER_TEMP/ci-triage/copilot-session.md" 2>/dev/null || echo "(no transcript)"
          } >> "$GITHUB_STEP_SUMMARY"

  post:
    needs: triage
    if: ${{ needs.triage.outputs.has_draft == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      GH_TOKEN: ${{ github.token }}
      WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      REPORT_NAME: ${{ github.event.workflow_run.name || github.workflow }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/playwright
          ref: main

      - name: Download triage draft
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-triage-${{ inputs.pr_number }}
          path: output

      - name: Post triage comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { collapsePreviousComments } = require('./tests/config/postReportComment');
            const sentinel = `<!-- playwright-ci-triage --><!-- ${process.env.REPORT_NAME} -->`;
            const prNumber = +process.env.PR_NUMBER;
            await collapsePreviousComments(github, context, prNumber, sentinel);
            const triage = fs.readFileSync('output/triage.md', 'utf8');
            const body = `${triage}\n\n<sub>Triaged by the Playwright bot - [agent run](${process.env.WORKFLOW_URL})</sub>\n${sentinel}\n`;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: prNumber,
              body,
            });
