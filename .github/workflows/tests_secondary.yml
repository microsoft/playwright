name: "tests 2"

on:
  push:
    branches:
      - main
      - release-*
  pull_request:
    types: [ labeled ]
    branches:
      - main
      - release-*

env:
  # Force terminal colors. @see https://www.npmjs.com/package/colors
  FORCE_COLOR: 1

permissions:
  contents: read    # This is required for actions/checkout to succeed

jobs:
  test_mac:
    name: ${{ matrix.os }} (${{ matrix.browser }})
    if: ${{ github.event_name == 'push' || github.event.label.name == 'CQ1' }}
    strategy:
      fail-fast: false
      matrix:
        # Intel: *-large
        # Arm64: *-xlarge
        os: [macos-15-large, macos-15-xlarge]
        browser: [chromium, firefox, webkit]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/run-test
      with:
        browsers-to-install: ${{ matrix.browser }} chromium
        command: npm run test -- --project=${{ matrix.browser }}-*
        bot-name: "${{ matrix.browser }}-${{ matrix.os }}"

  test_win:
    name: windows-large - ${{ matrix.browser }}
    if: ${{ github.event_name == 'push' || github.event.label.name == 'CQ1' }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        os: [playwright-x64-server2025-64-core]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/run-test
      with:
        browsers-to-install: ${{ matrix.browser }} chromium
        command: npm run test -- --project=${{ matrix.browser }}-* --workers 16
        bot-name: "${{ matrix.browser }}-${{ matrix.os }}"

  test-package-installations-other-node-versions:
    name: "Installation Test ${{ matrix.os }} (${{ matrix.node_version }})"
    if: ${{ github.event_name == 'push' || github.event.label.name == 'CQ1' }}
    runs-on: ${{ matrix.os  }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          node_version: 24
        - os: ubuntu-latest
          node_version: 26
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - run: npm install -g yarn@1
    - run: npm install -g pnpm@8
    - name: Setup Ubuntu Binary Installation # TODO: Remove when https://github.com/electron/electron/issues/42510 is fixed
      if: ${{ runner.os == 'Linux' }}
      run: |
        if grep -q "Ubuntu 24" /etc/os-release; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
      shell: bash
    - uses: ./.github/actions/run-test
      with:
        node-version: ${{ matrix.node_version }}
        command: npm run itest
        bot-name: "package-installations-${{ matrix.os }}-node${{ matrix.node_version }}"

  test_linux:
    name: ${{ matrix.os }} (${{ matrix.browser }}${{ matrix.node-version != 22 && format(' - Node.js {0}', matrix.node-version) || '' }})
    if: ${{ github.event_name == 'push' || github.event.label.name == 'CQ1' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            node-version: 24
            browser: chromium
          - os: ubuntu-22.04
            node-version: 26
            browser: chromium
          - os: ubuntu-22.04-arm
            node-version: 22
            browser: chromium
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/run-test
      with:
        node-version: ${{ matrix.node-version }}
        browsers-to-install: ${{ matrix.browser }} chromium
        command: npm run test -- --project=${{ matrix.browser }}-*
        bot-name: "${{ matrix.browser }}-${{ matrix.os }}-node${{ matrix.node-version }}"

  test_clock_frozen_time_linux:
    name: time library - ${{ matrix.clock }}
    if: ${{ github.event_name == 'push' || github.event.label.name == 'CQ1' }}
    strategy:
      fail-fast: false
      matrix:
        clock: [frozen, realtime]
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/run-test
      with:
        node-version: 22
        browsers-to-install: chromium
        command: npm run test -- --project=chromium-*
        bot-name: "${{ matrix.clock }}-time-library-chromium-linux"
      env:
        PW_CLOCK: ${{ matrix.clock }}

  test_test_runner:
    name: Test Runner - ubuntu-large - Node.js ${{ matrix.node-version }}
    if: ${{ github.event_name == 'push' || github.event.label.name == 'CQ1' }}
    strategy:
      fail-fast: false
      matrix:
        os: [playwright-x64-ubuntu24-64-core]
        node-version: [24, 26]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/run-test
      with:
        node-version: ${{matrix.node-version}}
        command: npm run ttest
        bot-name: "${{ matrix.os }}-node${{ matrix.node-version }}"

  tracing_linux:
    name: Tracing ${{ matrix.browser }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/run-test
      with:
        browsers-to-install: ${{ matrix.browser }} chromium
        command: npm run test -- --project=${{ matrix.browser }}-*
        bot-name: "tracing-${{ matrix.browser }}"
      env:
        PWTEST_TRACE: 1

  test_chromium_channels:
    name: Test ${{ matrix.channel }} on ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: chrome
            runs-on: ubuntu-22.04
          - channel: chrome
            runs-on: macos-latest
          - channel: chrome
            runs-on: playwright-x64-server2025-64-core
          - channel: chrome-beta
            runs-on: ubuntu-22.04
          - channel: msedge
            runs-on: playwright-x64-server2025-64-core
          - channel: msedge-dev
            runs-on: playwright-x64-server2025-64-core
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/run-test
      with:
        browsers-to-install: ${{ matrix.channel }}
        command: npm run ctest -- ${{ startsWith(matrix.runs-on, 'playwright-') && '--workers 16' || '' }}
        bot-name: ${{ matrix.channel }}-${{ matrix.runs-on }}
      env:
        PWTEST_CHANNEL: ${{ matrix.channel }}

  test_android:
    name: Android - ubuntu-large
    runs-on: playwright-x64-ubuntu24-64-core
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Enable KVM group perms
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
    - name: Create Android Emulator
      run: utils/avd_recreate.sh
    - name: Start Android Emulator
      run: utils/avd_start.sh
    - uses: ./.github/actions/run-test
      with:
        browsers-to-install: android
        command: npm run atest
        bot-name: "android"

  test_electron:
    name: Electron - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read    # This is required for actions/checkout to succeed
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Ubuntu Binary Installation # TODO: Remove when https://github.com/electron/electron/issues/42510 is fixed
      if: ${{ runner.os == 'Linux' }}
      run: |
        if grep -q "Ubuntu 24" /etc/os-release; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
      shell: bash
    # Prevent stalling when macOS decides to show the reopen windows prompt
    # after killing enough Electron processes. See https://github.com/electron/electron/pull/51488.
    - name: Turn off the reopen windows prompt on macOS
      if: ${{ matrix.os == 'macos-latest' }}
      run: defaults write com.github.Electron ApplePersistenceIgnoreState YES
      shell: bash
    - uses: ./.github/actions/run-test
      with:
        browsers-to-install: chromium
        setup-command: npx install-electron --no
        command: npm run etest
        bot-name: "electron-${{ matrix.os }}"
