name: 'Collect the review'
description: >
  Collects the context of a revision into review.json in the directory, for the revision agent, and
  uploads the directory as an artifact. The file has three parts: the issue that the pull request
  is for, with its text and the comments on it; the pull request, with its description and
  commits; and the comments, reviews and unresolved review threads on the pull request. Only the
  comments of people with write access, the maintainers, and of the bot itself get through. Fails
  when the maintainers left nothing to address.
inputs:
  pull-request:
    description: 'Number of the pull request'
    required: true
  dir:
    description: 'Directory to write review.json to; uploaded as the artifact'
    required: false
    default: ${{ runner.temp }}/review
  artifact-name:
    description: 'Name of the uploaded artifact'
    required: false
    default: 'review'
  token:
    description: 'Token that reads the pull request, the issue and the collaborators'
    required: false
    default: ${{ github.token }}
outputs:
  head:
    description: 'Head commit of the pull request'
    value: ${{ steps.collect.outputs.head }}
  base:
    description: 'Tip of the base branch of the pull request, to rebase on'
    value: ${{ steps.collect.outputs.base }}
  branch:
    description: 'Head branch of the pull request'
    value: ${{ steps.collect.outputs.branch }}
runs:
  using: composite
  steps:
  - name: Collect the issue, the pull request and the comments
    id: collect
    uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
    env:
      PULL_NUMBER: ${{ inputs.pull-request }}
      DIR: ${{ inputs.dir }}
    with:
      github-token: ${{ inputs.token }}
      script: |
        const fs = require('fs');
        const path = require('path');
        const { PULL_NUMBER, DIR } = process.env;
        const { owner, repo } = context.repo;
        const pull_number = Number(PULL_NUMBER);
        fs.mkdirSync(DIR, { recursive: true });

        const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
        const { data: { commit: { sha: base } } } = await github.rest.repos.getBranch({ owner, repo, branch: pr.base.ref });
        const commits = await github.paginate(github.rest.pulls.listCommits, { owner, repo, pull_number, per_page: 100 });
        const fields = 'author { __typename login } body createdAt url';
        const { repository: { pullRequest: data } } = await github.graphql(`
          query($owner: String!, $repo: String!, $number: Int!) {
            repository(owner: $owner, name: $repo) {
              pullRequest(number: $number) {
                closingIssuesReferences(first: 1) { nodes { number } }
                comments(last: 100) { totalCount nodes { ${fields} } }
                reviews(last: 100) { totalCount nodes { ${fields} state } }
                reviewThreads(last: 100) {
                  totalCount
                  nodes {
                    isResolved isOutdated path line originalLine
                    comments(first: 100) { totalCount nodes { ${fields} fullDatabaseId diffHunk } }
                  }
                }
              }
            }
          }`, { owner, repo, number: pull_number });

        // The issue that the pull request closes. A coverage PR closes none: its branch names the issue.
        const issueNumber = data.closingIssuesReferences.nodes[0]?.number ?? Number(pr.head.ref.match(/^triage\/(\d+)\//)?.[1] ?? 0);
        const issueData = issueNumber ? (await github.graphql(`
          query($owner: String!, $repo: String!, $number: Int!) {
            repository(owner: $owner, name: $repo) {
              issue(number: $number) { number url title body author { login } comments(last: 100) { totalCount nodes { ${fields} } } }
            }
          }`, { owner, repo, number: issueNumber })).repository.issue : null;

        const connections = [['comments on the PR', data.comments], ['reviews', data.reviews], ['review threads', data.reviewThreads], ...data.reviewThreads.nodes.map(t => [`comments in a thread on ${t.path}`, t.comments])];
        if (issueData)
          connections.push(['comments on the issue', issueData.comments]);
        for (const [name, connection] of connections) {
          if (connection.totalCount > connection.nodes.length)
            core.warning(`Read only ${connection.nodes.length} of ${connection.totalCount} ${name}`);
        }

        // People with write access are the maintainers. The bot is the app; before the app posted
        // the triage notes, github-actions did, with the marker.
        const maintainers = new Map();
        const roleOf = async c => {
          const author = c.author;
          if (author?.__typename === 'Bot' && author.login.replace(/\[bot\]$/, '') === 'microsoft-playwright-automation')
            return 'bot';
          if (author?.__typename === 'Bot' && author.login === 'github-actions' && c.body.includes('<!-- playwright-ai-triage -->'))
            return 'bot';
          if (author?.__typename !== 'User')
            return undefined;
          if (!maintainers.has(author.login)) {
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username: author.login }).catch(() => ({ data: {} }));
            maintainers.set(author.login, ['admin', 'write'].includes(data.permission));
          }
          return maintainers.get(author.login) ? 'maintainer' : undefined;
        };
        // A comment from a maintainer or from the bot, or undefined for anyone else.
        const entry = async c => {
          const role = await roleOf(c);
          return role && { role, author: role === 'bot' ? 'microsoft-playwright-automation[bot]' : c.author.login, createdAt: c.createdAt, url: c.url, body: c.body };
        };

        const issue = issueData && {
          number: issueData.number,
          url: issueData.url,
          title: issueData.title,
          author: issueData.author?.login,
          body: issueData.body,
          comments: [],
        };
        for (const c of issueData?.comments.nodes ?? []) {
          const e = await entry(c);
          if (e)
            issue.comments.push(e);
        }

        const comments = [];
        for (const c of data.comments.nodes) {
          const e = await entry(c);
          if (e)
            comments.push({ kind: 'comment', ...e });
        }
        for (const r of data.reviews.nodes) {
          const e = r.body.trim() && await entry(r);
          if (e)
            comments.push({ kind: 'review', state: r.state, ...e });
        }
        for (const t of data.reviewThreads.nodes) {
          if (t.isResolved)
            continue;
          const thread = [];
          for (const c of t.comments.nodes) {
            // The id is what the agent replies to, in a reply call.
            const e = await entry(c);
            if (e)
              thread.push({ id: Number(c.fullDatabaseId), ...e });
          }
          if (thread.some(c => c.role === 'maintainer'))
            comments.push({ kind: 'thread', path: t.path, line: t.line ?? t.originalLine, outdated: t.isOutdated, diffHunk: t.comments.nodes[0].diffHunk, createdAt: thread[0].createdAt, comments: thread });
        }
        comments.sort((a, b) => a.createdAt.localeCompare(b.createdAt));
        if (!comments.some(c => c.role === 'maintainer' || c.comments?.some(t => t.role === 'maintainer')))
          throw new Error('There are no comments from maintainers to address, other than in resolved threads');

        fs.writeFileSync(path.join(DIR, 'review.json'), JSON.stringify({
          issue,
          pullRequest: {
            number: pr.number,
            url: pr.html_url,
            title: pr.title,
            body: pr.body,
            head: pr.head.sha,
            base,
            commits: commits.map(c => ({ sha: c.sha, date: c.commit.committer.date, message: c.commit.message })),
          },
          comments,
        }, null, 2));
        core.setOutput('head', pr.head.sha);
        core.setOutput('base', base);
        core.setOutput('branch', pr.head.ref);
  - name: Upload the review
    uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
    with:
      name: ${{ inputs.artifact-name }}
      path: ${{ inputs.dir }}
