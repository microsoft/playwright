name: 'Upload blob report'
description: 'Upload blob report to GitHub artifacts'
inputs:
  report_dir:
    description: 'Directory containing blob report'
    required: true
    default: 'test-results/blob-report'
  job_name:
    description: 'Unique job name'
    required: true
    default: ''
runs:
  using: "composite"
  steps:
    - name: Integrity check
      shell: bash
      run: |
        echo "::group::extracting blob archives"
        find "${{ inputs.report_dir }}" -name "*.zip" -exec unzip -t {} \;
        echo "::endgroup::"
    - name: Upload blob report to GitHub
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: blob-report-${{ inputs.job_name }}
        path: ${{ inputs.report_dir }}/**
        retention-days: 7
        overwrite: true
