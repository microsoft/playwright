name: 'Run browser tests'
description: 'Run browser tests'
inputs:
  setup-command:
    description: 'Extra setup command to run before tests'
    required: false
  command:
    description: 'Command to run tests'
    required: true
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '22'
  browsers-to-install:
    description: 'Browser to install. Default is all browsers.'
    required: false
    default: ''
  bot-name:
    description: 'Bot name'
    required: true
  shard-index:
    description: 'Shard index (optional)'
    required: false
    default: '0'
  shell:
    description: 'Shell to use'
    required: false
    default: 'bash'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: ${{ inputs.node-version }}
    - run: |
        echo "::group::npm ci"
        npm ci
        echo "::endgroup::"
      shell: bash
    - run: |
        echo "::group::npm run build"
        npm run build
        echo "::endgroup::"
      shell: bash
    - run: |
        echo "::group::npx playwright install --with-deps"
        npx playwright install --with-deps ${{ inputs.browsers-to-install }}
        echo "::endgroup::"
      shell: bash
    - run: echo "PLAYWRIGHT_SETUP_COMPLETE=true" >> $GITHUB_ENV
      shell: bash
    - name: Run setup command
      if: inputs.setup-command != ''
      run: ${{ inputs.setup-command }}
      shell: bash
    - uses: ./.github/actions/test-env
    - name: Run tests
      if: inputs.shell == 'bash'
      run: $EXEC ${{ inputs.command }}
      shell: bash
      env:
        PW_TAG: "@${{ inputs.bot-name }}"
    - name: Run tests
      if: inputs.shell != 'bash'
      run: |
        ${{ runner.os == 'Windows' && (inputs.shell == 'pwsh' || inputs.shell == 'powershell') && '. $env:WINDOWS_NORMAL_IO' || '' }}
        ${{ inputs.command }}
      shell: ${{ inputs.shell }}
      env:
        PW_TAG: "@${{ inputs.bot-name }}"
    - name: Upload blob report
      if: ${{ !cancelled() && env.PLAYWRIGHT_SETUP_COMPLETE == 'true' && (github.event_name == 'pull_request' || failure()) }}
      uses: ./.github/actions/upload-blob-report
      with:
        report_dir: blob-report
        job_name: ${{ inputs.bot-name }}-${{ inputs.shard-index }}
    - name: Upload parquet report
      if: ${{ !cancelled() && env.PLAYWRIGHT_SETUP_COMPLETE == 'true' }}
      uses: ./.github/actions/upload-parquet-report
      with:
        job_name: ${{ inputs.bot-name }}-${{ inputs.shard-index }}
