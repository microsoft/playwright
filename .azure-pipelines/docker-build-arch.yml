parameters:
- name: arch
  type: string
  values:
  - amd64
  - arm64
- name: releaseChannel
  type: string

steps:
- checkout: self
  fetchDepth: 0
  displayName: "Checkout code"

- task: UseNode@1
  inputs:
    version: '26.x'
  displayName: "Install Node.js"

# Relocate the Docker data-root to the large /mnt volume: this job builds 3
# images (jammy/noble/resolute) and `docker system prune`s between them, so the
# default disk fills up.
- task: Bash@3
  displayName: "Setup docker"
  inputs:
    targetType: "inline"
    script: |
      set -x
      sudo service docker stop
      sudo mkdir -p /etc/docker
      echo '{ "data-root": "/mnt/docker" }' | sudo tee /etc/docker/daemon.json
      sudo service docker start

- task: Bash@3
  displayName: "setup .npmrc"
  inputs:
    targetType: "inline"
    script: |
      echo "registry=https://devdiv.pkgs.visualstudio.com/DevDiv/_packaging/DevDiv_PublicPackages/npm/registry/" >> .npmrc
      echo "registry=https://devdiv.pkgs.visualstudio.com/DevDiv/_packaging/DevDiv_PublicPackages/npm/registry/" >> tests/playwright-test/stable-test-runner/.npmrc

- task: npmAuthenticate@0
  displayName: "authenticate the private npm registry"
  inputs:
    workingFile: .npmrc

- task: npmAuthenticate@0
  displayName: "authenticate the private npm registry for stable-test-runner"
  inputs:
    workingFile: tests/playwright-test/stable-test-runner/.npmrc

- script: npm ci
  displayName: "npm ci"

- script: npm run build
  displayName: "npm run build"

- task: AzureCLI@2
  displayName: "Login to ACR via OIDC"
  inputs:
    azureSubscription: "Playwright-CDN"
    scriptType: "bash"
    scriptLocation: "inlineScript"
    inlineScript: "az acr login --name playwright"

# When building arm64 on an amd64 host, register QEMU (binfmt) so `docker build
# --platform linux/arm64` can cross-build via emulation. The binfmt image is
# pulled through the ACR cache to avoid Docker Hub rate limits, so this must run
# after `az acr login`.
- ${{ if eq(parameters.arch, 'arm64') }}:
  - task: Bash@3
    displayName: "Register QEMU (binfmt) for arm64 cross-build"
    inputs:
      targetType: "inline"
      script: "docker run --rm --privileged ${ACR_CACHE_PREFIX}tonistiigi/binfmt --install arm64"
    env:
      ACR_CACHE_PREFIX: "playwright.azurecr.io/cached/"

- task: Bash@3
  displayName: "Build & publish ${{ parameters.arch }} Docker images"
  inputs:
    targetType: "inline"
    script: "./utils/docker/publish_docker.sh ${{ parameters.releaseChannel }} ${{ parameters.arch }}"
  env:
    ACR_CACHE_PREFIX: "playwright.azurecr.io/cached/"
